<text x="118" y="538" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F4F5" text-anchor="start" letter-spacing="0">A 0.6 second head start</text>
<text x="118" y="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">Sound is played just after it is heard. In that gap the models decide</text>
<text x="118" y="578" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">who was talking and the filter finishes, so nothing reaches you unfiltered.</text>
