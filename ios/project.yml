name: HearProbe
options:
  bundleIdPrefix: com.voicetap
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  FluidAudio:
    path: ../vendor/FluidAudio
targets:
  HearProbe:
    type: application
    platform: iOS
    sources: [HearProbe]
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - framework: ../vendor/ort/onnxruntime.xcframework
        embed: false
      - sdk: CoreML.framework
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: libsqlite3.tbd
      - sdk: Accelerate.framework
    info:
      path: HearProbe/Info.plist
      properties:
        CFBundleDisplayName: Tether
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "Tether listens to the room so you can pick who to hear."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Tether sends short clips of what it hears to your Mac on the same Wi-Fi, which tells it when someone says something you may want to hear."
        NSMotionUsageDescription: "Tether uses the gyroscope to know which way the phone points during the direction test."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: HearProbe/HearProbe-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        PRODUCT_BUNDLE_IDENTIFIER: com.voicetap.hearprobe.${DEVELOPMENT_TEAM}
