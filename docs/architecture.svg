<text x="266" y="346" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">Tracks up to four voices,</text>
