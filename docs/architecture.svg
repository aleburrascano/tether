<text x="856" y="538" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#B6A2F5" text-anchor="start" letter-spacing="0">optional</text>
<text x="738" y="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">Follows the conversation, names each voice (Barista, Teacher)</text>
<text x="738" y="578" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A1A1AA" text-anchor="start" letter-spacing="0">and raises a card when someone says something you should not miss.</text>
